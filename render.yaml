services:
  - type: web
    name: smogon-rag-api
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd RAG && gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 Server:app
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-specdec
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: SHOW_RETRIEVAL_DEBUG
        value: "0"
